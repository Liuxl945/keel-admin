server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 分片上传单片默认 5MB（UPLOAD_CHUNK_SIZE_MB 可调到 32），整文件兼容接口 10MB；
    # 这里留足余量，避免 nginx 先于后端返回 413。
    client_max_body_size 64m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 静态资源带 hash，长缓存；index.html 不缓存，避免发版后拿到旧入口
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 后端所有接口都挂在 /api 下，proxy_pass 不带路径以保留前缀
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件分片、导出 Excel 都可能慢于默认 60s
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    location /uploads/ {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 1d;
    }

    # 前端是 history 路由，未知路径回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
