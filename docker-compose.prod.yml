# 生产环境编排。用法见 docs/deploy.md 或 scripts/deploy.sh
# 必须带 --env-file .env.production：compose 从这里取变量，server 容器也从它读环境变量。
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build

name: admin-base-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-admin_base}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.production 里设置 POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
    # 不映射宿主端口：数据库只给 server 走内网；需要本机连库调试时再临时加 ports
    networks: [internal]

  server:
    build:
      context: .
      target: server
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.production 里设置 POSTGRES_PASSWORD}
      DB_DATABASE: ${POSTGRES_DB:-admin_base}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [internal]

  web:
    build:
      context: .
      target: web
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-8092}:80'
    depends_on:
      server:
        condition: service_healthy
    networks: [internal]

volumes:
  pgdata:
    name: admin_base_prod_pgdata
  uploads:
    name: admin_base_prod_uploads

networks:
  internal:
    driver: bridge
